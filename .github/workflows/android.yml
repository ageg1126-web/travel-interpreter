name: Android app

# Builds the Galaxy (Android) app: a Trusted Web Activity that opens the
# GitHub Pages site in Chrome, so web updates reach the app without a reinstall.
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Build release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Sign APK
        working-directory: android
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
          "$BT/apksigner" sign --ks release.keystore --ks-key-alias travelhelper \
            --ks-pass pass:travelhelper --key-pass pass:travelhelper --out travel-helper.apk aligned.apk
          "$BT/apksigner" verify travel-helper.apk
      - uses: actions/upload-artifact@v4
        with:
          name: travel-helper-apk
          path: android/travel-helper.apk
      - name: Publish as the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete app-latest --yes --cleanup-tag || true
          gh release create app-latest android/travel-helper.apk \
            --title "여행 도우미 앱 (갤럭시)" \
            --notes "휴대폰에서 travel-helper.apk 를 눌러 받아 설치하세요." --latest
