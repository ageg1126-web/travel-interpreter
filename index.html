<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#d52b1e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="통역">
<title>여행 통역</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>여행 통역</h1>
  <button id="settingsBtn" class="icon-btn" aria-label="설정">⚙︎</button>
</header>

<main>
  <div id="unsupported" class="notice" hidden>
    이 브라우저는 음성인식을 지원하지 않아요. 아이폰은 Safari, 안드로이드는 Chrome으로 열어 주세요.
  </div>

  <ul id="log" aria-live="polite"></ul>

  <div id="live" class="live" hidden>
    <span id="liveLang" class="badge"></span>
    <span id="liveText"></span>
  </div>
</main>

<footer>
  <div class="turn">
    <button id="turnKo" class="turn-btn" data-lang="ko">🇰🇷 한국어로 말하기</button>
    <button id="turnEn" class="turn-btn" data-lang="en">🇨🇦 Speak English</button>
  </div>
  <button id="mainBtn" class="main-btn">
    <span id="mainIcon">🎤</span>
    <span id="mainLabel">통역 시작</span>
  </button>
  <p id="hint" class="hint">버튼을 누르고 한국어로 말씀하세요. 번역 후에는 자동으로 상대방(영어) 차례로 바뀝니다.</p>
</footer>

<dialog id="settings">
  <form method="dialog">
    <h2>설정</h2>
    <label class="row"><input type="checkbox" id="optSpeak" checked> 번역 결과 소리로 읽어주기</label>
    <label class="row"><input type="checkbox" id="optAlternate" checked> 번역 후 자동으로 상대 언어 듣기</label>
    <label class="row">글자 크기
      <input type="range" id="optFont" min="16" max="34" value="22">
    </label>
    <label class="row">말하기 속도
      <input type="range" id="optRate" min="0.6" max="1.2" step="0.1" value="0.9">
    </label>
    <button type="button" id="clearBtn" class="secondary">대화 기록 지우기</button>
    <button value="close" class="primary">닫기</button>
  </form>
</dialog>

<script src="translate.js"></script>
<script src="app.js"></script>
</body>
</html>
